[package]
name = "editor"
description = "The editor binary: gpui over mirror's model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
adam = { workspace = true }
engine = { workspace = true }
meats = { workspace = true }
bifrost = { workspace = true }
mirror = { workspace = true }
chassis = { workspace = true }
# The viewport's picking and gizmo work in `mirror`'s own types, which are glam:
# the camera matrices the panel hands them are glam's too.
glam = { workspace = true }
log = { workspace = true }
# The viewport turns a readback frame into a gpui image: `RenderImage` is built
# from an `image::Frame`, so the editor names the same `image` crate gpui does.
image = { workspace = true }
smallvec = "1"

[dependencies.gpui]
git = "https://github.com/zed-industries/zed"
rev = "28d0a354"

# `gpui` alone has no platform implementation at this rev: the Win32, X11/Wayland,
# AppKit and wasm backends all moved into sibling crates, and `Application` can only
# be built from one. `gpui_platform::application()` is the constructor every
# example in the checkout uses, and it is the only way to open a window.
#
# The Linux backends are **not** on by default: `gpui_platform`'s default features
# are `multithreaded` alone, and `gpui_linux` resolves with no features unless one
# is named here. Without them `application()` still builds, still constructs the
# platform, and still runs the window closure -- so the editor started, ran its
# frame loop, and never opened a window: no window, no output, sitting there.
# Windows and macOS pick their backend from the target, so naming these is inert
# there.
[dependencies.gpui_platform]
git = "https://github.com/zed-industries/zed"
rev = "28d0a354"
features = ["wayland", "x11"]
