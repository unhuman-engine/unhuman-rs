[workspace]
resolver = "2"
# `default-members` keeps `cargo build` / `cargo test` at the root working on a
# machine with no cmake, no Vulkan SDK and no driver. The backend crates are
# built explicitly with `-p stormbreaker` / `-p stormglass`. `editor` is left out
# too: gpui is a git dependency and a long build, and nothing that does not open
# a window should have to pay for it.
default-members = [
    "UHE/src/core",
    "UHE/src/engine",
    "UHE/src/rhi",
    "UHE/src/shaders",
    "UHE/src/jobs",
    "UHE/src/events",
    "UHE/src/platform",
    "UHE/src/scene",
    "UHE/src/assets",
    "UHE/src/renderer",
    "UHE/src/audio",
    "UHE/src/physics",
    "UHE-EDITOR/mirror",
    "UHE-AIMLAB/aimlab",
    "UHE/bins/nocap",
    "UHE/bins/sandbox",
]
members = [
    "UHE/src/core",
    "UHE/src/engine",
    "UHE/src/rhi",
    "UHE/src/shaders",
    "UHE/src/jobs",
    "UHE/src/events",
    "UHE/src/platform",
    "UHE/src/scene",
    "UHE/src/assets",
    "UHE/src/renderer",
    "UHE/src/audio",
    "UHE/src/physics",
    "UHE-EDITOR/mirror",
    "UHE-EDITOR/editor",
    "UHE-AIMLAB/aimlab",
    "UHE/bins/nocap",
    "UHE/bins/sandbox",
    "UHE/Stormbreaker/vulkan",
    "UHE/Stormbreaker/wgpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/unhuman-engine/unhuman-rs.git"

[workspace.dependencies]
adam = { path = "UHE/src/core" }
chassis = { path = "UHE/src/rhi" }
forge = { path = "UHE/src/shaders" }
grind = { path = "UHE/src/jobs" }
pings = { path = "UHE/src/events" }
eyes = { path = "UHE/src/platform" }
meats = { path = "UHE/src/scene" }
vault = { path = "UHE/src/assets" }
bifrost = { path = "UHE/src/renderer" }
wire = { path = "UHE/src/audio" }
femur = { path = "UHE/src/physics" }
mirror = { path = "UHE-EDITOR/mirror" }
engine = { path = "UHE/src/engine" }
aimlab = { path = "UHE-AIMLAB/aimlab" }
stormbreaker = { path = "UHE/Stormbreaker/vulkan" }
stormglass = { path = "UHE/Stormbreaker/wgpu" }

# Pinned to the versions already in this machine's cargo cache where one is
# there, so the source of every dependency can be read before it is called into.
glam = "0.33"
hecs = "0.11"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
winit = "0.30"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga"] }
gltf = { version = "1.4", features = ["utils", "names", "extensions"] }
naga = { version = "30", features = ["wgsl-in", "spv-out", "spv-in"] }
ab_glyph = "0.2"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
rodio = "0.23"
rapier3d = "0.36"
wgpu = { version = "30", features = ["spirv"] }

# A debug build still has to run at a usable frame rate.
#
# Rust's default `dev` profile optimises nothing: not this workspace, not the
# dependencies. That is fine for a CLI and ruinous for a renderer, because every
# hot path is inside a dependency -- `glam` matrix maths, `wgpu` validation,
# `rapier`'s solver, the glTF loader -- and each is 5-20x slower at opt-level 0
# with no inlining across the crate boundary. The C++ engine's debug build keeps
# its maths header-only and inlined, which is the entire reason its debug FPS
# reads better; this closes that gap without giving up debug info or `debug_assert`
# in our own crates.
#
# Dependencies go to `opt-level = 3` because they are not the code being debugged
# and their assertions only slow a frame down. The workspace goes to `1`, not
# `3`: enough to inline the small math and iteration helpers where the time is
# actually spent, while keeping line-level stepping and backtraces meaningful.
#
# Debug info stays on for dependencies too. It is what makes a `wgpu` validation
# panic readable -- the frames above the workspace's own are in `wgpu` and
# `naga`, and a backtrace that names them without a line is a backtrace that
# sends you to the wrong file. The cost is real: every test binary links both
# drivers and `gpui`, so it is paid once per binary. `cargo clean` is the answer
# to the size, not a smaller backtrace.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
